<!-- Diseño perron -->
 <div class="coke-city-selector">
  <button id="cokeBtn">🌵 Andamos en CDMX 📍</button>
  <ul id="cokeList" class="hidden">
    <li>Guadalajara</li>
    <li>Monterrey</li>
    <li>Cancún</li>
  </ul>
  <!-- Burbujas mexicanas -->
  <div class="bubbles">
    <span></span><span></span><span></span>
  </div>
</div>

<style>
/* Contenedor */
.coke-city-selector { 
  position: relative; 
  display: inline-block; 
  font-family: 'Brush Script MT', cursive;
}

/* Botón */
#cokeBtn {
  background-color: #E41A1C;
  color: white;
  padding: 12px 24px;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  font-size: 1.2rem;
  position: relative;
  transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 0 8px rgba(228,26,28,0.5);
}

#cokeBtn:hover {
  transform: scale(1.05);
  box-shadow: 0 0 15px rgba(228,26,28,0.8);
}

/* Lista dropdown */
#cokeList { 
  position: absolute; top: 110%; left: 0; 
  background: white; border: 2px solid #E41A1C; 
  list-style: none; padding: 0; margin: 0; border-radius: 12px;
  min-width: 160px;
  z-index: 100;
}
#cokeList li { padding: 10px 14px; cursor: pointer; transition: background 0.2s; }
#cokeList li:hover { background: #f1f1f1; }

/* Esconder */
.hidden { display: none; }

/* Burbujas mexicanas */
.bubbles span {
  position: absolute;
  bottom: 0;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: red;
  animation: rise 2s infinite;
}
.bubbles span:nth-child(2) { left: 30%; background: green; animation-delay: 0.5s; }
.bubbles span:nth-child(3) { left: 60%; background: white; animation-delay: 1s; }

@keyframes rise {
  0% { transform: translateY(0) scale(0.8); opacity: 0.8; }
  50% { transform: translateY(-20px) scale(1); opacity: 1; }
  100% { transform: translateY(-40px) scale(0.8); opacity: 0; }
}
</style>

<script>
const btn = document.getElementById('cokeBtn');
const list = document.getElementById('cokeList');

btn.addEventListener('click', () => list.classList.toggle('hidden'));

list.querySelectorAll('li').forEach(item => {
  item.addEventListener('click', () => {
    btn.innerHTML = '🌵 📍 ' + item.textContent; // actualiza ciudad
    list.classList.add('hidden');
    // Aquí podrías actualizar contenido de landing
  });
});

// Cierra dropdown al hacer clic afuera
document.addEventListener('click', e => {
  if (!btn.contains(e.target) && !list.contains(e.target)) {
    list.classList.add('hidden');
  }
});
</script>
